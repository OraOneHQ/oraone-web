name: OraOne Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_reason:
        description: 'Reason for manual deployment'
        required: false
        default: 'Manual production deployment'
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - production
      - linux
      - ec2
    timeout-minutes: 20

    steps:
      - name: Resolve deployment source
        shell: bash
        run: |
          set -euo pipefail
          echo "Workflow triggered from: ${GITHUB_REF}"
          echo "Deployment source is pinned to: refs/heads/main"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preflight Health Diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set +e

          check_endpoint() {
            label="$1"
            url="$2"
            out_file="/tmp/oraone-preflight-$(echo "$label" | tr ' ' '_' | tr '[:upper:]' '[:lower:]').txt"

            code=$(curl -sS --max-time 10 -o "$out_file" -w "%{http_code}" "$url")
            rc=$?

            echo "[PREFLIGHT] ${label}: ${url}"
            if [ $rc -ne 0 ]; then
              echo "[PREFLIGHT] curl failed (exit=${rc})"
              echo "[PREFLIGHT] ----"
              return
            fi

            echo "[PREFLIGHT] status=${code}"
            echo "[PREFLIGHT] body:"
            cat "$out_file"
            echo
            echo "[PREFLIGHT] ----"
          }

          check_endpoint "Local API health" "http://localhost:8000/api/health"
          check_endpoint "Local root health" "http://localhost:8000/health"
          check_endpoint "Public API health" "https://api.oraone.in/api/health"
          check_endpoint "Public root health" "https://api.oraone.in/health"

      - name: Run Deploy Script
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/deployment/deploy.sh scripts/deployment/rollback.sh
          ./scripts/deployment/deploy.sh 2>&1 | tee /tmp/oraone-deploy.log

      - name: Verify Backend Status
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet oraone-backend
          echo "oraone-backend is active"

      - name: Health Check Local
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if curl -fsS http://localhost:8000/api/health >/dev/null 2>&1 || curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "Local health check passed"
              exit 0
            fi
            echo "Local health retry $i/10"
            sleep 2
          done
          echo "Local health check failed"
          exit 1

      - name: Health Check Public
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..10}; do
            if curl --max-time 10 -fsS https://api.oraone.in/api/health >/dev/null 2>&1 || curl --max-time 10 -fsS https://api.oraone.in/health >/dev/null 2>&1; then
              echo "Public health check passed"
              exit 0
            fi
            echo "Public health retry $i/10"
            sleep 3
          done
          echo "Public health check failed"
          exit 1

      - name: Print Deployment Log
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/oraone-deploy.log ]; then
            echo "=== /tmp/oraone-deploy.log ==="
            cat /tmp/oraone-deploy.log
          else
            echo "Deployment log file was not created"
          fi

      - name: Deployment Complete
        if: success()
        run: echo "Deployment completed successfully"
