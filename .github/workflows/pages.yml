name: Deploy Frontend to GitHub Pages

# Frontend is an independently-deployable static SPA (see docs/ARCHITECTURE.md).
# Backend services (FastAPI, future Node/Express BFF, Redis, Postgres) are
# NOT deployed by this workflow — GitHub Pages only serves static assets.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (lint runs as part of the CRA build)
        env:
          CI: true
          # Public, non-secret runtime config — see docs/ENVIRONMENT.md.
          # Set in the repo's Actions variables (Settings > Secrets and
          # variables > Actions > Variables). If unset, api.js derives a
          # same-scheme https://api.<hostname> default at runtime instead of
          # ever falling back to a plain http:// localhost URL, so a
          # misconfigured/unset variable can never cause a mixed-content
          # request on the deployed (https) site.
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || '' }}
        run: yarn build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
