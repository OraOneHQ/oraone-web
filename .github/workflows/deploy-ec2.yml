name: Deploy to EC2 (backend + frontend)

# Builds and redeploys the self-hosted Docker Compose stack — backend API
# and frontend, both behind the Caddy reverse proxy — on the production EC2
# instance whenever main changes. Runs after CI (ci.yml) passes, so nothing
# broken ever reaches the server. Skips the actual rebuild/redeploy (via the
# `changes` job) when the triggering commit didn't touch anything this stack
# serves (e.g. a docs-only or CloudFormation-only commit) — cheap to check,
# saves several minutes and a needless container churn on the box.
#
# This is separate from pages.yml, which deploys the GitHub-Pages-hosted
# copy of the frontend at oraone.in. This workflow targets the EC2-hosted
# stack (api.oraone.in) and always deploys backend + frontend together so
# the two can never drift out of sync on the server.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   EC2_HOST        Public IP or hostname of the instance.
#   EC2_USER        SSH username (e.g. "ubuntu").
#   EC2_SSH_KEY     Private key (PEM, matching the key pair on the instance).
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  changes:
    name: Detect deployable changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      relevant: ${{ steps.check.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Check for backend/frontend/infra changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet HEAD^ HEAD -- backend frontend docker-compose.prod.yml Caddyfile .github/workflows/deploy-ec2.yml; then
            echo "No deployable paths changed — skipping container rebuild/redeploy."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy stack over SSH
    needs: changes
    runs-on: ubuntu-latest
    # Only deploy if CI actually succeeded (or this was a manual dispatch)
    # AND the commit actually touched something this stack serves — a
    # docs/README/CloudFormation-only push has nothing to redeploy.
    if: ${{ needs.changes.outputs.relevant == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /home/ubuntu/oraone-web

            git fetch origin main
            git reset --hard origin/main

            docker compose -f docker-compose.prod.yml build backend frontend
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            echo "Waiting for backend + frontend containers to report healthy..."
            for i in $(seq 1 20); do
              backend_health=$(docker inspect -f '{{.State.Health.Status}}' oraone-backend 2>/dev/null || echo "missing")
              frontend_health=$(docker inspect -f '{{.State.Health.Status}}' oraone-frontend 2>/dev/null || echo "missing")
              echo "attempt $i/20: backend=$backend_health frontend=$frontend_health"
              if [ "$backend_health" = "healthy" ] && [ "$frontend_health" = "healthy" ]; then
                echo "Both containers healthy."
                exit 0
              fi
              sleep 6
            done
            echo "Containers did not become healthy in time."
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail 50 backend frontend
            exit 1

      - name: Verify public health endpoint
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ secrets.EC2_HOST_DOMAIN || 'api.oraone.in' }}/api/health"; then
              echo ""
              echo "Health check passed."
              exit 0
            fi
            echo "Retrying health check ($i/10)..."
            sleep 6
          done
          echo "Public health check failed."
          exit 1
