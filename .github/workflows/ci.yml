name: CI

# Quality gate for every push/PR: install → lint/build (frontend) and
# install → syntax-check → unit tests (backend). This workflow never
# deploys anything — see pages.yml for the GitHub Pages deployment.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint + production build
        # CRA/CRACO runs ESLint as part of the build; CI=true turns warnings
        # into failures so lint issues block the pipeline.
        env:
          CI: true
        run: yarn build

  backend:
    name: Backend (syntax + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Self-hosted auth (app/core/config.py) requires this at import time —
      # CI has no backend/.env, so provide a throwaway 32+ char value here.
      JWT_SECRET_KEY: ci-only-placeholder-secret-do-not-use-in-prod-1234567890
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -c "import ast,glob; [ast.parse(open(f, encoding='utf-8').read(), filename=f) for f in glob.glob('app/**/*.py', recursive=True)]"

      - name: Import check (catches broken imports/circular deps)
        run: python -c "import server"

      - name: Unit tests (no external DB/AWS required)
        run: |
          pytest tests/test_entitlements.py tests/test_authorization.py \
                 tests/test_phase5_org_isolation.py tests/test_phase6_agents_crud.py \
                 tests/test_phase6_knowledge.py tests/test_phase7_processing.py \
                 tests/test_redis_failure.py tests/test_idempotency_concurrency.py \
                 tests/test_ai_provider_fallback.py tests/test_tracing.py \
                 tests/test_webhook_outbox.py -q
