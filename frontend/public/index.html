    <!--
      Restore the real path after the GitHub Pages 404.html redirect trick
      (see public/404.html). No-op on any other host/local dev.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- OraOne live chat widget (dogfooding our own embeddable assistant).
         Renders a fixed launcher at the bottom-right of every page and restores
         each visitor's prior conversation via a persistent localStorage id. -->
    <script>
      (function () {
        var WIDGET_ID = "wgt_po0RnvfF9hjxaERsqT3G6Prf";
        // Skip the authenticated product surface so the support bubble does not
        // overlap the in-app chat experience.
        if (/^\/app(\/|$)/.test(window.location.pathname)) return;
        var host = window.location.hostname;
        var isLocal = host === "localhost" || host === "127.0.0.1";
        var s = document.createElement("script");
        s.src = "/widget.js";
        s.async = true;
        s.setAttribute("data-widget-id", WIDGET_ID);
        // In local dev the API runs on a separate port; in production the widget
        // and API are served from the same origin, so no data-api is needed.
        if (isLocal) s.setAttribute("data-api", "http://127.0.0.1:8000");
        document.body.appendChild(s);
      })();
    </script>
