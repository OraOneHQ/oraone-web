<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OraOne Widget — Embed Demo</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      .hero {
        max-width: 760px;
        margin: 0 auto;
        padding: 80px 24px;
      }
      h1 { font-size: 34px; margin: 0 0 12px; }
      p { font-size: 17px; line-height: 1.6; color: #475569; }
      code {
        background: #0f172a;
        color: #e2e8f0;
        padding: 14px 16px;
        border-radius: 10px;
        display: block;
        font-size: 13px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Acme Corp</h1>
      <p>
        This is a sample customer website. The OraOne AI assistant is embedded in
        the corner via a single <code>&lt;script&gt;</code> tag — click the bubble
        to chat with it.
      </p>
      <p>The embed used on this page:</p>
      <code>&lt;script src="https://cdn.oraone.in/widget.js" data-widget-id="wgt_po0RnvfF9hjxaERsqT3G6Prf" async&gt;&lt;/script&gt;</code>
    </div>

    <!-- OraOne widget embed -->
    <script
      src="/widget.js"
      data-widget-id="wgt_po0RnvfF9hjxaERsqT3G6Prf"
      async
    ></script>
  </body>
</html>
