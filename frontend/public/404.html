<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OraOne</title>
    <!--
      GitHub Pages has no server-side rewrite rules, so a direct load or
      refresh on a client-routed path (e.g. /products) 404s. This redirect
      trick (https://github.com/rafgraph/spa-github-pages) round-trips the
      path through a query string so index.html can restore it via
      history.replaceState before React Router mounts. pathSegmentsToKeep=0
      because oraone.in serves the app from the domain root, not a subpath.
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
