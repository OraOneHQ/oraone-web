
# Production-like local stack — Postgres, Redis, MinIO, backend, and
# frontend all via Docker. Auth is self-hosted (Argon2 + JWT) — see
# backend/.env.example's JWT_SECRET_KEY.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: oraone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oraone_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oraone_dev_password}
      POSTGRES_DB: oraone
    volumes:
      - oraone_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oraone_admin -d oraone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oraone-redis
    restart: unless-stopped
    volumes:
      - oraone_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: oraone-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-oraone_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-oraone_minio_password}
    volumes:
      - oraone_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: v1.0.0
    image: oraone-backend:v1.0.0
    container_name: oraone-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://oraone_admin:${DB_PASSWORD:-oraone_dev_password}@postgres:5432/oraone
      ALEMBIC_DATABASE_URL: postgresql+psycopg2://oraone_admin:${DB_PASSWORD:-oraone_dev_password}@postgres:5432/oraone
      REDIS_URL: redis://redis:6379/0
      ENTITLEMENTS_CACHE_BACKEND: redis
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-oraone-documents}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-oraone_minio}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-oraone_minio_password}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        APP_VERSION: v1.0.0
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000}
    image: oraone-frontend:v1.0.0
    container_name: oraone-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      - backend

  proxy:
    # Single edge entry point (TLS termination, gzip, security headers) —
    # optional but recommended for anything beyond local testing. Backend
    # and frontend keep their direct host ports above too, so this is purely
    # additive; point real traffic at :80/:443 instead once you're ready.
    image: caddy:2-alpine
    container_name: oraone-proxy
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - oraone_caddy_data:/data
    depends_on:
      - backend
      - frontend

volumes:
  oraone_postgres_data:
  oraone_redis_data:
  oraone_minio_data:
  oraone_caddy_data:
