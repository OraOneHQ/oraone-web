<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; }
  #stage { width: 100vw; height: 100vh; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <svg id="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" preserveAspectRatio="xMidYMid meet">
    <defs>
      <linearGradient id="tg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
      </linearGradient>
    </defs>
    <rect width="64" height="64" rx="16.64" fill="url(#tg)"/>
    <g transform="translate(10.24,10.24) scale(1.088)">
      <circle cx="20" cy="20" r="13" fill="none" stroke="#FFFFFF" stroke-width="2.8"/>
      <circle cx="20" cy="20" r="5" fill="#FFFFFF"/>
      <circle cx="29.19" cy="10.81" r="3.4" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.3"/>
    </g>
  </svg>
</div>
</body>
</html>
