<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  #lockup {
    display: inline-flex; align-items: center; gap: 22px;
    padding: 28px 40px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #word { font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-size: 108px; }
  #word .a { color: #0A1B3A; }
  #word .b { color: #1E73E8; }
</style>
</head>
<body>
<div id="lockup">
  <svg width="132" height="132" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="mk" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
        <stop stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/>
      </linearGradient>
    </defs>
    <circle cx="20" cy="20" r="13" fill="none" stroke="url(#mk)" stroke-width="2.8"/>
    <circle cx="20" cy="20" r="5" fill="url(#mk)"/>
    <circle cx="29.19" cy="10.81" r="3.4" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.3"/>
  </svg>
  <span id="word"><span class="a">Ora</span><span class="b">One</span></span>
</div>
</body>
</html>
