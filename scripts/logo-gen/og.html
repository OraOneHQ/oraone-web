<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  #card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background: radial-gradient(1200px 700px at 78% 18%, #123a6b 0%, #0A1B3A 46%, #070f22 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  /* faint oversized orbit motif in the corner */
  #ghost { position: absolute; right: -140px; top: -160px; opacity: 0.10; }
  #lockup { display: inline-flex; align-items: center; gap: 26px; z-index: 2; }
  #word { font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-size: 116px; }
  #word .a { color: #FFFFFF; }
  #word .b { color: #38BDF8; }
  #tag {
    z-index: 2; margin-top: 38px; display: inline-flex; align-items: center; gap: 16px;
    color: rgba(226,232,240,0.86); font-weight: 600; font-size: 32px; letter-spacing: 0.01em;
  }
  #tag .rule { height: 2px; width: 46px; background: linear-gradient(90deg,#2563EB,#06B6D4); border-radius: 2px; }
</style>
</head>
<body>
<div id="card">
  <svg id="ghost" width="560" height="560" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
    <circle cx="20" cy="20" r="13" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
    <circle cx="29.19" cy="10.81" r="3.4" fill="#FFFFFF"/>
  </svg>
  <div id="lockup">
    <svg width="176" height="176" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="mk" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
          <stop stop-color="#38BDF8"/><stop offset="1" stop-color="#06B6D4"/>
        </linearGradient>
      </defs>
      <circle cx="20" cy="20" r="13" fill="none" stroke="url(#mk)" stroke-width="2.8"/>
      <circle cx="20" cy="20" r="5" fill="#FFFFFF"/>
      <circle cx="29.19" cy="10.81" r="3.4" fill="#06B6D4" stroke="#FFFFFF" stroke-width="1.3"/>
    </svg>
    <span id="word"><span class="a">Ora</span><span class="b">One</span></span>
  </div>
  <div id="tag"><span class="rule"></span> One AI. Every Conversation. <span class="rule"></span></div>
</div>
</body>
</html>
